name: LoveDays
options:
  bundleIdPrefix: com.edui
  deploymentTarget:
    iOS: "16.0"
targets:
  LoveDays:
    type: application
    platform: iOS
    sources: [LoveDays]
    dependencies:
      - target: LoveDaysWidget
        embed: true
    entitlements:
      path: Config/LoveDays.entitlements
      properties:
        com.apple.security.application-groups: [group.com.edui.lovedays]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edui.lovedays
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Love Days"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Keeps your memories private"
  LoveDaysWidget:
    type: app-extension
    platform: iOS
    sources:
      - LoveDaysWidget
      - LoveDays/Shared.swift
    info:
      path: Config/Widget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.edui.lovedays]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edui.lovedays.widget
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Love Days"
        SKIP_INSTALL: YES
